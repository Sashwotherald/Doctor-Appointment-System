<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reset your password - Herald Clinical Sanctuary"
    />
    <title>Reset Password | Herald Clinical Sanctuary</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <div class="logo-icon logo-icon-centered">
            <i class="fas fa-shield-heart"></i>
          </div>
        </a>
      </div>

      <!-- Reset Password Card -->
      <div class="auth-card" id="reset-card">
        <h2>Reset Password</h2>
        <p class="subtitle">Enter your OTP and new password below</p>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label for="reset-otp">One-Time Password (OTP)</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-key"></i></span>
              <input
                type="text"
                id="reset-otp"
                placeholder="Enter 6-digit OTP"
                required
              />
            </div>
            <div class="form-error" id="reset-otp-error"></div>
          </div>

          <div class="form-group">
            <label for="reset-password">New Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                id="reset-password"
                placeholder="Min 6 characters"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="toggle-reset-pw"
                aria-label="Toggle password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-error" id="reset-password-error"></div>
          </div>

          <div class="form-group">
            <label for="reset-confirm-password">Confirm New Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                id="reset-confirm-password"
                placeholder="Repeat password"
                required
              />
              <button
                type="button"
                class="toggle-password"
                id="toggle-reset-confirm-pw"
                aria-label="Toggle confirm password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-error" id="reset-confirm-error"></div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full btn-lg"
            id="reset-submit-btn"
          >
            Reset Password
          </button>
        </form>

        <div class="auth-footer">
          <a href="login.html">Back to Login</a>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/utils.js?v=2"></script>
    <script src="../js/reset-password.js?v=2"></script>
  </body>
</html>
