<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Create your Herald Clinical Sanctuary account - Join as a patient or doctor."
    />
    <title>Sign Up | Herald Clinical Sanctuary</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <div class="auth-container auth-container-wide">
      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <div class="logo-icon logo-icon-centered">
            <i class="fas fa-shield-heart"></i>
          </div>
        </a>
      </div>

      <!-- Register Card -->
      <div class="auth-card" id="register-card">
        <h2>Create Account</h2>
        <p class="subtitle">Join Herald Clinical Sanctuary today</p>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-user"></i></span>
              <input
                type="text"
                id="reg-name"
                placeholder="John Doe"
                required
              />
            </div>
            <div class="form-error" id="reg-name-error"></div>
          </div>

          <div class="form-group">
            <label for="reg-email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-envelope"></i></span>
              <input
                type="email"
                id="reg-email"
                placeholder="john@example.com"
                required
                autocomplete="email"
              />
            </div>
            <div class="form-error" id="reg-email-error"></div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="reg-password">Password</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                <input
                  type="password"
                  id="reg-password"
                  placeholder="Min 6 chars"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  id="toggle-reg-pw"
                  aria-label="Toggle password visibility"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="form-error" id="reg-password-error"></div>
            </div>

            <div class="form-group">
              <label for="reg-confirm-password">Confirm Password</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fas fa-lock"></i></span>
                <input
                  type="password"
                  id="reg-confirm-password"
                  placeholder="Repeat"
                  required
                />
                <button
                  type="button"
                  class="toggle-password"
                  id="toggle-reg-confirm-pw"
                  aria-label="Toggle confirm password visibility"
                >
                  <i class="fas fa-eye"></i>
                </button>
              </div>
              <div class="form-error" id="reg-confirm-error"></div>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-role">I am a</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-user-tag"></i></span>
              <select id="reg-role" required>
                <option value="">Select your role</option>
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
              </select>
            </div>
            <div class="form-error" id="reg-role-error"></div>
          </div>

          <!-- Doctor-specific fields (hidden by default) -->
          <div id="doctor-fields" class="is-hidden">
            <div class="form-group">
              <label for="reg-specialization">Specialization</label>
              <div class="input-wrapper">
                <span class="input-icon"
                  ><i class="fas fa-stethoscope"></i
                ></span>
                <select id="reg-specialization">
                  <option value="">Select specialization</option>
                  <option value="General Physician">General Physician</option>
                  <option value="Cardiologist">Cardiologist</option>
                  <option value="Dermatologist">Dermatologist</option>
                  <option value="Neurologist">Neurologist</option>
                  <option value="Orthopedic">Orthopedic</option>
                  <option value="Pediatrician">Pediatrician</option>
                  <option value="Psychiatrist">Psychiatrist</option>
                  <option value="Gynecologist">Gynecologist</option>
                  <option value="Ophthalmologist">Ophthalmologist</option>
                  <option value="ENT Specialist">ENT Specialist</option>
                  <option value="Dentist">Dentist</option>
                  <option value="Urologist">Urologist</option>
                  <option value="Oncologist">Oncologist</option>
                  <option value="Endocrinologist">Endocrinologist</option>
                  <option value="Gastroenterologist">Gastroenterologist</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="reg-nmc">NMC Number</label>
              <div class="input-wrapper">
                <span class="input-icon"><i class="fas fa-id-card"></i></span>
                <input
                  type="text"
                  id="reg-nmc"
                  placeholder="Enter NMC number"
                />
              </div>
              <div class="form-error" id="reg-nmc-error"></div>
            </div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full btn-lg mt-8"
            id="register-submit-btn"
          >
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Login</a>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
