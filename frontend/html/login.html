<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Login to Herald Clinical Sanctuary - Access your secure clinical workspace."
    />
    <title>Login | Herald Clinical Sanctuary</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body class="auth-page">
    <div class="auth-container">
      <!-- Logo -->
      <div class="auth-logo">
        <a href="index.html" class="logo">
          <div class="logo-icon logo-icon-centered">
            <i class="fas fa-shield-heart"></i>
          </div>
        </a>
      </div>

      <!-- Login Card -->
      <div class="auth-card" id="login-card">
        <h2>Welcome Back</h2>
        <p class="subtitle">Access your secure clinical workspace</p>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="login-email">Email</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-user"></i></span>
              <input
                type="email"
                id="login-email"
                placeholder="dr.smith@clinic.com"
                required
                autocomplete="email"
              />
            </div>
            <div class="form-error" id="login-email-error"></div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon"><i class="fas fa-lock"></i></span>
              <input
                type="password"
                id="login-password"
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
              <button
                type="button"
                class="toggle-password"
                id="toggle-login-pw"
                aria-label="Toggle password visibility"
              >
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="form-error" id="login-password-error"></div>
          </div>

          <button
            type="submit"
            class="btn btn-primary btn-full btn-lg"
            id="login-submit-btn"
          >
            Login
          </button>
        </form>

        <div class="auth-footer">
          New to Herald Clinical Sanctuary? <a href="register.html">Sign Up</a>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toast-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
